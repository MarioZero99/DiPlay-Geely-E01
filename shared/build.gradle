plugins {
    id 'com.android.library'
}

// The car hop, when this build was asked for one.
//
// Its sources, resources, native half and payload live outside this repository, under the directory
// `-PvendorHopDir=<path>` names. Given, they are compiled into this module like any other source,
// which is what lets the hop keep using the module's internal types. Not given — the tree as
// published, CI, any other machine — none of it is on the source path, `VendorCarHop` is a class
// nothing defines, and the build is the AOSP path. Nothing has to be deleted to publish this tree,
// because none of it is here.
//
// The command line is the only place this is read from. A `gradle.properties` entry or an environment
// variable would both be inherited, and an inherited input deciding what a package contains is what
// this replaced. A path that was given but names no directory is a typo, not a request for the AOSP
// build, so it fails instead of quietly falling back.
def vendorHopValue = gradle.startParameter.projectProperties['vendorHopDir']
def vendorHopDirectory = vendorHopValue == null ? null : new File(vendorHopValue)
if (vendorHopDirectory != null && !vendorHopDirectory.isDirectory()) {
    throw new GradleException("-PvendorHopDir=${vendorHopValue} is not a directory")
}
def vendorHopPayload = vendorHopDirectory == null ? null : new File(vendorHopDirectory, 'payload')
def vendorHopAssets = new File(layout.buildDirectory.get().asFile, 'generated/vendorHopAssets')

// The payload the hop installs, by the name the hop's own code looks it up under. Its hash is what
// every install is checked against, and the check is generated from the bytes below rather than
// written into the source: a payload replaced without the source constant being updated used to be
// ignored in silence, because the store on the device found the file already laid down hashing to the
// old value and never decrypted the new one.
def vendorHopCandidateName = 'gocsdk-spp-uuid128-v2'
// The file the hash is published as. Plain text in the payload directory on the head unit (the
// scripts read it with the shell's own `read`), encrypted like the rest on its way into the APK.
def vendorHopCandidatePin = 'candidate-sha'

// The USB-adapter stack, when this build was asked for one.
//
// Same shape as the hop above, and read the same way: `-PadapterDir=<path>` names a directory outside
// this repository holding the adapter's Kotlin, resources and native half — the native half goes to the
// makefile below through ADAPTER_HCI_JNI. Given, they are compiled into this module like its own
// sources. Not given — the tree as published, CI, any other machine — nothing of it is on the source
// path, no adapter native code is built, and the build is the AOSP path.
def adapterValue = gradle.startParameter.projectProperties['adapterDir']
def adapterDirectory = adapterValue == null ? null : new File(adapterValue)
if (adapterDirectory != null && !adapterDirectory.isDirectory()) {
    throw new GradleException("-PadapterDir=${adapterValue} is not a directory")
}

def encryptVendorPayload = vendorHopPayload == null ? null : tasks.register('encryptVendorPayload') {
    group = 'build'
    description = 'Encrypt the car hop payload into the assets the app reads.'
    def payloads = vendorHopPayload
    def keyHeader = new File(vendorHopDirectory, 'jni/payload_key.h')
    def destination = vendorHopAssets
    inputs.dir(payloads)
    inputs.file(keyHeader)
    outputs.dir(destination)
    doLast {
        // Cleared first: outputs.dir is not cleaned when the set of files it holds changes, so a
        // payload that is renamed or dropped would otherwise stay in the generated directory and be
        // packaged into the APK alongside the ones this task actually wrote.
        destination.deleteDir()
        def body = keyHeader.text
        def hex = body.substring(body.indexOf('{') + 1, body.indexOf('}'))
            .replaceAll('0x', '').replaceAll('[^0-9a-fA-F]', '')
        if (hex.length() != 64) {
            throw new GradleException("${keyHeader.name} must hold 32 bytes, found ${hex.length() / 2}")
        }
        byte[] key = new byte[32]
        for (int i = 0; i < key.length; i++) {
            key[i] = (byte) Integer.parseInt(hex.substring(i * 2, i * 2 + 2), 16)
        }
        def target = new File(destination, 'payload')
        target.mkdirs()
        def sha256 = { byte[] bytes ->
            java.security.MessageDigest.getInstance('SHA-256').digest(bytes)
                .collect { String.format('%02x', it & 0xff) }
                .join()
        }
        def encryptInto = { File out, byte[] plain ->
            // Derived from the payload rather than drawn at random: the same bytes have to encrypt to
            // the same file or this task re-runs on every build. Distinct payloads get distinct
            // nonces, which is the property GCM needs of them.
            def nonce = java.util.Arrays.copyOf(
                java.security.MessageDigest.getInstance('SHA-256').digest(plain), 12)
            def cipher = javax.crypto.Cipher.getInstance('AES/GCM/NoPadding')
            cipher.init(
                javax.crypto.Cipher.ENCRYPT_MODE,
                new javax.crypto.spec.SecretKeySpec(key, 'AES'),
                new javax.crypto.spec.GCMParameterSpec(128, nonce))
            out.withOutputStream { stream ->
                stream.write(nonce)
                stream.write(cipher.doFinal(plain))
            }
        }
        payloads.listFiles()
            .findAll { it.isFile() && it.name != vendorHopCandidatePin }
            .sort { it.name }
            .each { payload -> encryptInto(new File(target, "${payload.name}.enc"), payload.bytes) }
        // The pin is computed here, from the bytes this task just encrypted, so the hash and the binary
        // it describes are packaged in one step and cannot be out of step with each other.
        def candidate = new File(payloads, vendorHopCandidateName)
        if (!candidate.isFile()) {
            throw new GradleException(
                "${candidate} is missing; there is no candidate for ${vendorHopCandidatePin} to pin")
        }
        encryptInto(
            new File(target, "${vendorHopCandidatePin}.enc"),
            (sha256(candidate.bytes) + '\n').getBytes('UTF-8'))
    }
}

// A plaintext payload under assets/ would be packaged and shipped, which is the one thing the
// encrypted form is here to stop. Anything found there is a mistake however it got in.
def rejectPlaintextVendorPayload = tasks.register('rejectPlaintextVendorPayload') {
    group = 'verification'
    description = 'Reject a checked-in hop payload that should have been generated.'
    def stray = fileTree('src/main/assets/payload')
    doLast {
        def files = stray.files
        if (!files.isEmpty()) {
            throw new GradleException(
                "payload assets are generated by encryptVendorPayload; remove ${files*.name}")
        }
    }
}

android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 19
        targetSdk = 37
        multiDexEnabled true

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-19'
                // The module's own makefile includes the adapter's by this name, when there is one.
                if (adapterDirectory != null) {
                    arguments "ADAPTER_HCI_JNI=${new File(adapterDirectory, 'jni')}"
                }
                // The module's own makefile includes the hop's by this name, when there is one.
                if (vendorHopDirectory != null) {
                    arguments "VENDOR_HOP_JNI=${new File(vendorHopDirectory, 'jni')}"
                }
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // NDK r25c is the last supported toolchain that still targets Android 4.4 (API 19).
    ndkVersion = '25.2.9519653'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    sourceSets {
        main {
            if (vendorHopDirectory != null) {
                res.srcDir(new File(vendorHopDirectory, 'res'))
                assets.srcDir(vendorHopAssets)
            }
            if (adapterDirectory != null) {
                res.srcDir(new File(adapterDirectory, 'res'))
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
}

// Kotlin sources go through the variant API rather than sourceSets: since AGP 9 the legacy
// `android.sourceSets` view still carries resources and assets but no longer feeds the compile.
androidComponents {
    onVariants(selector().all()) { variant ->
        if (vendorHopDirectory != null) {
            variant.sources.java.addStaticSourceDirectory(new File(vendorHopDirectory, 'src').absolutePath)
            variant.unitTest?.sources?.java?.addStaticSourceDirectory(new File(vendorHopDirectory, 'test').absolutePath)
        }
        if (adapterDirectory != null) {
            variant.sources.java.addStaticSourceDirectory(new File(adapterDirectory, 'src').absolutePath)
            variant.unitTest?.sources?.java?.addStaticSourceDirectory(new File(adapterDirectory, 'test').absolutePath)
        }
    }
}

if (encryptVendorPayload != null) {
    tasks.configureEach { task ->
        // Everything that reads the source sets' assets has to be told who writes the generated
        // directory: the merge tasks package it and the lint tasks describe it, and `sourceSets` above
        // hands neither of them that knowledge.
        //
        // Matched without case, because AGP names these two ways: `generate...LintModel` carries a
        // capital L, while `lintVitalAnalyzeRelease` and `lintAnalyzeRelease` start lower case. The
        // capital-L-only match left the second kind out, and a release build then failed Gradle's
        // implicit-dependency check outright -- but only when this module's release lint happened to
        // re-run, so a build that had it up to date succeeded and the next one did not.
        if ((task.name.startsWith('merge') && task.name.endsWith('Assets')) ||
                task.name.toLowerCase().contains('lint')) {
            task.dependsOn(encryptVendorPayload)
        }
    }
}
tasks.named('preBuild') {
    dependsOn(rejectPlaintextVendorPayload)
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation libs.bouncycastle
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}

// The adapter's native stack, built for the machine running the tests, so the host test can drive the real
// BtstackBluetoothHost and the real transport instead of a second implementation of either.
//
// Nothing about it lives here any more — not the sources, not the script — so a build with no adapter has
// nothing to build and no host test that would want it. Hence the task exists only when the directory does,
// and the sources are read where they are rather than through this project's own paths. On a machine with
// no C compiler or no JDK headers the script prints why and builds nothing, and the test skips itself.
def hostBtstackLibs = layout.buildDirectory.dir('host-libs')
def buildHostBtstackLibs = null
if (adapterDirectory != null) {
    def adapter = adapterDirectory
    buildHostBtstackLibs = tasks.register('buildHostBtstackLibs', Exec) {
        group = 'verification'
        description = 'Builds the adapter native stack for the host test.'
        commandLine 'sh', new File(adapter, 'tools/build-host-btstack.sh').absolutePath,
                adapter.absolutePath, hostBtstackLibs.get().asFile.absolutePath
        inputs.files(fileTree(new File(adapter, 'jni')) { include '**/*.c', '**/*.h' })
        inputs.files(fileTree(new File(adapter, 'hostTest/c')))
        inputs.file(new File(adapter, 'tools/build-host-btstack.sh'))
        outputs.dir(hostBtstackLibs)
    }
}

tasks.withType(Test).configureEach {
    if (buildHostBtstackLibs != null) {
        dependsOn buildHostBtstackLibs
        // The library is found at run time off java.library.path, so it is never on the test classpath and
        // never in the up-to-date check. It has to be an input for that reason alone: a change to the native
        // stack rebuilt the library and left the test results untouched, so the tests reported the last
        // run's verdict for code that was already gone.
        inputs.dir(hostBtstackLibs).withPropertyName('hostBtstackLibs')
    }
    // System.loadLibrary searches here, which is how the shipping code finds the host build without
    // knowing a test exists. With no adapter this names a directory that stays empty, and nothing looks.
    systemProperty 'java.library.path', hostBtstackLibs.get().asFile.absolutePath
}
