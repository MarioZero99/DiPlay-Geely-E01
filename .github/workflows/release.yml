name: Release car-test APK

# Bump versionName in mobile/build.gradle.kts and write docs/release-notes/v<versionName>.md
# before running this. The tag is derived from versionName — never created by hand — and a
# version that already has a Release is left alone.
#
# Runs only when asked. A push to main publishes nothing: what this job builds is a plain
# checkout, which has none of the local-only inputs a release build is made with, so it is not
# the package to hand out. Cut the release from the machine that has them, and use a manual run
# here only to check that the tree builds.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify, but do not create a GitHub Release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      notes: ${{ steps.derive.outputs.notes }}
      skip: ${{ steps.derive.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive the tag from versionName and decide whether to publish
        id: derive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' mobile/build.gradle.kts | head -1)
          [ -n "$version_name" ] || {
            echo "::error::cannot read versionName from mobile/build.gradle.kts"; exit 1; }
          tag="v$version_name"
          notes="docs/release-notes/$tag.md"
          {
            echo "tag=$tag"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"
          echo "versionName $version_name -> tag $tag"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: the build runs, the Release step does not."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a Release; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require release notes for this version
        if: steps.derive.outputs.skip != 'true'
        run: |
          set -euo pipefail
          notes="${{ steps.derive.outputs.notes }}"
          [ -f "$notes" ] || {
            echo "::error::$notes is missing. Write the release notes in the same commit as the version bump."
            exit 1; }

      - name: Reject credential files in public source
        if: steps.derive.outputs.skip != 'true'
        run: python3 scripts/check_public_tree.py

  release:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug --stacktrace

      # Signing material lands in $RUNNER_TEMP, outside $GITHUB_WORKSPACE, so no
      # git or artifact-upload path can reach it. GitHub wipes it after the job.
      - name: Materialize signing inputs outside the workspace
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          DIPLAY_MFI_PK8_B64: ${{ secrets.DIPLAY_MFI_PK8_B64 }}
          DIPLAY_MFI_P7B_B64: ${{ secrets.DIPLAY_MFI_P7B_B64 }}
          SIGNING_DIR: ${{ runner.temp }}/signing
          AUTH_DIR: ${{ runner.temp }}/auth-assets
        run: |
          set -euo pipefail
          mkdir -p "$SIGNING_DIR" "$AUTH_DIR/offline-mfi"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$SIGNING_DIR/diplay-release.jks"
          printf '%s' "$DIPLAY_MFI_PK8_B64"   | base64 -d > "$AUTH_DIR/offline-mfi/identity.pk8"
          printf '%s' "$DIPLAY_MFI_P7B_B64"   | base64 -d > "$AUTH_DIR/offline-mfi/certificate.p7b"

      - name: Build the car-test APK
        env:
          DIPLAY_SIGNING_DIR: ${{ runner.temp }}/signing
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/auth-assets
          DIPLAY_DIST_DIR: ${{ runner.temp }}/dist
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/diplay-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: sh scripts/package-geely.sh release

      # The packaging script owns the file name; locate what it actually wrote rather
      # than re-deriving it here, so the two can never drift apart.
      - name: Locate the built APK
        id: artifact
        run: |
          set -euo pipefail
          dist="${{ runner.temp }}/dist"
          apk=$(ls "$dist"/*.apk)
          [ "$(printf '%s\n' "$apk" | wc -l)" -eq 1 ] || {
            echo "::error::expected exactly one APK in $dist, found: $apk"; exit 1; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$apk" .apk)" >> "$GITHUB_OUTPUT"
          echo "Built $(basename "$apk")"

      - name: Verify the APK before it can be published
        env:
          APK: ${{ steps.artifact.outputs.path }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          report=$("$apksigner" verify -v --print-certs "$APK")
          echo "$report"
          echo "$report" | grep -q 'v1 scheme (JAR signing): true' \
            || fail 'no v1 (JAR) signature — Android 4.4 head units refuse this APK'
          echo "$report" | grep -q 'v2 scheme (APK Signature Scheme v2): true' \
            || fail 'no v2 signature'
          echo "$report" | grep -q 'certificate DN: CN=DiPlay Geely E01' \
            || fail 'signed with an unexpected certificate'
          unzip -l "$APK" | grep -q 'assets/offline-mfi/identity.pk8' \
            || fail 'no accessory identity in the APK — it would install but never connect'
          unzip -l "$APK" | grep -q 'assets/offline-mfi/certificate.p7b' \
            || fail 'no accessory certificate in the APK'
          # This APK is published, so the log-upload key must not be in it. The packaging script
          # clears the fields whenever CI is set; this is the check that the switch reached the build.
          if unzip -p "$APK" 'classes*.dex' \
            | grep -aE 'sb_publishable_|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9' >/dev/null; then
            fail 'the APK carries a Supabase key — a build made from git must not upload anything'
          fi
          # The car hop is not in a release, and neither is what it installs: the encrypted payload
          # assets, the native half that decrypts them, and the hop class itself. -PvendorHopDir is what
          # decides all three, and this is the check that the decision reached the package — a release
          # built in a shell that still exported the retired variable is exactly what this catches.
          if unzip -l "$APK" | grep -qE 'assets/payload/|lib/.*/libpayload_crypto\.so'; then
            fail 'the APK carries the car hop payload — a release must not'
          fi
          if unzip -p "$APK" 'classes*.dex' | grep -a 'carhop/VendorCarHop' >/dev/null; then
            fail 'the APK carries the car hop implementation — a release must not'
          fi

      - name: Checksums
        env:
          APK: ${{ steps.artifact.outputs.path }}
        run: |
          set -euo pipefail
          cd "$(dirname "$APK")"
          sha256sum "$(basename "$APK")" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the GitHub Release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ needs.version.outputs.tag }}" \
            --title "DiPlay Geely E01 ${{ needs.version.outputs.tag }}" \
            --notes-file "${{ needs.version.outputs.notes }}" \
            "${{ steps.artifact.outputs.path }}" \
            "${{ runner.temp }}/dist/SHA256SUMS.txt"

      - name: Upload the APK as an artifact instead
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ steps.artifact.outputs.path }}
            ${{ runner.temp }}/dist/SHA256SUMS.txt

      - name: Remove materialized credentials
        if: always()
        run: rm -rf "${{ runner.temp }}/signing" "${{ runner.temp }}/auth-assets"
